		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":22250484,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const partesDoJogo = [["21abe48bdd1a6bc4e413ceccdc9232317ecf97545dd8f57cee8196b67100ac58.bin", 3145728], ["6d057cd00a3cf21167631bc0ad345183d266065a79074f417dfa860379e47c2f.bin", 3145728], ["4aa235a083327da4e10f065d89c8ddd564d194fded0bf2c1ef1f05be1d67fdbd.bin", 3145728], ["bb2558dd3991eef63fb8142621c020a37c65e5c3941ca5fea9ea4b2f72b1bb2e.bin", 3145728], ["ef285ad2b7ee5be9dedb8a7014230ace77505bb007cc34e9d2c5d4c004c862f0.bin", 3145728], ["8ea4e455b5c48dfc295e78e7d1a51b9913d683b8c54abe7a09a2dc2eeb96f399.bin", 3145728], ["236964465e9d2516327005aec82255f183dead8725c7f8dd58ccfc2af0fb7638.bin", 3145728], ["433d06a96d0d7588f234d0a14ca4dd97be4b104a3ea962a938ac44acfdbb305a.bin", 230388]];
// Recebe a mesma exportação testada localmente em blocos estáticos.
async function iniciarPocketAnimals({ onProgress }) {
	const size = GODOT_CONFIG.fileSizes["index.pck"];
	const pack = new Uint8Array(size);
	async function carregarPartes() {
		let offset = 0;
		for (const [name, length] of partesDoJogo) {
			const response = await fetch(name);
			if (!response.ok) throw new Error("Falha ao carregar o jogo. Recarregue a página.");
			const data = new Uint8Array(await response.arrayBuffer());
			if (data.length !== length) throw new Error("O download do jogo ficou incompleto.");
			pack.set(data, offset);
			offset += length;
			onProgress(offset, size);
		}
		if (offset !== size) throw new Error("O pacote do jogo está incompleto.");
	}
	await Promise.all([engine.init(GODOT_CONFIG.executable), carregarPartes()]);
	engine.copyToFS("index.pck", pack);
	return engine.start({ args: ["--main-pack", "index.pck", ...GODOT_CONFIG.args] });
}


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		iniciarPocketAnimals({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
